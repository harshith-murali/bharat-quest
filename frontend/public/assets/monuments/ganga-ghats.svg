<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="skyVaranasi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="40%" stop-color="#581c87"/>
      <stop offset="75%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gangaWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <filter id="diyaGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="200" height="200" rx="24" fill="url(#skyVaranasi)"/>

  <!-- Sun Disk behind Temples -->
  <circle cx="100" cy="85" r="32" fill="#fef08a" opacity="0.3"/>
  <circle cx="100" cy="85" r="22" fill="#ffedd5" opacity="0.6"/>

  <!-- Background Temple Shikharas (Spire Silhouettes) -->
  <!-- Left Temple -->
  <path d="M 25 130 L 35 70 Q 40 55 45 70 L 55 130 Z" fill="#451a03"/>
  <line x1="40" y1="55" x2="40" y2="48" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="40" cy="47" r="1.5" fill="#f59e0b"/>

  <!-- Center Main Temple -->
  <path d="M 70 130 L 85 45 Q 100 30 115 45 L 130 130 Z" fill="#78350f"/>
  <path d="M 82 130 L 92 52 Q 100 40 108 52 L 118 130 Z" fill="#92400e"/>
  <!-- Kalasha & Trishul Spire -->
  <line x1="100" y1="30" x2="100" y2="18" stroke="#fbbf24" stroke-width="2"/>
  <path d="M 96 22 L 104 22 M 97 19 L 100 16 L 103 19" stroke="#fbbf24" stroke-width="1.5" fill="none"/>

  <!-- Right Temple -->
  <path d="M 145 130 L 155 75 Q 160 62 165 75 L 175 130 Z" fill="#451a03"/>
  <line x1="160" y1="62" x2="160" y2="55" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Tiered Stone Ghat Steps -->
  <polygon points="10,140 190,140 190,146 10,146" fill="#d97706"/>
  <polygon points="15,146 185,146 185,152 15,152" fill="#b45309"/>
  <polygon points="20,152 180,152 180,158 20,158" fill="#78350f"/>

  <!-- Sacred River Ganga -->
  <rect x="0" y="158" width="200" height="42" fill="url(#gangaWater)"/>

  <!-- Floating Earthen Diyas on Water with Glow -->
  <!-- Diya 1 -->
  <g transform="translate(45, 175)">
    <circle cx="0" cy="0" r="8" fill="#ff9933" opacity="0.4" filter="url(#diyaGlow)"/>
    <ellipse cx="0" cy="2" rx="6" ry="2.5" fill="#78350f"/>
    <path d="M 0 0 Q -2 -5 0 -7 Q 2 -5 0 0 Z" fill="#fef08a"/>
  </g>

  <!-- Diya 2 (Center Big) -->
  <g transform="translate(100, 180)">
    <circle cx="0" cy="0" r="12" fill="#ff9933" opacity="0.5" filter="url(#diyaGlow)"/>
    <ellipse cx="0" cy="3" rx="8" ry="3.5" fill="#92400e"/>
    <path d="M 0 0 Q -3 -7 0 -10 Q 3 -7 0 0 Z" fill="#fef08a"/>
    <circle cx="0" cy="-3" r="2" fill="#ffffff"/>
  </g>

  <!-- Diya 3 -->
  <g transform="translate(155, 172)">
    <circle cx="0" cy="0" r="7" fill="#ff9933" opacity="0.4" filter="url(#diyaGlow)"/>
    <ellipse cx="0" cy="2" rx="5" ry="2" fill="#78350f"/>
    <path d="M 0 0 Q -2 -4 0 -6 Q 2 -4 0 0 Z" fill="#fef08a"/>
  </g>

  <!-- Water Shimmer Lines -->
  <path d="M 30 166 L 70 166" stroke="#38bdf8" stroke-width="1" opacity="0.4" stroke-linecap="round"/>
  <path d="M 120 168 L 170 168" stroke="#fef08a" stroke-width="1" opacity="0.5" stroke-linecap="round"/>

  <!-- Border Frame -->
  <rect x="2" y="2" width="196" height="196" rx="22" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.8"/>
</svg>
