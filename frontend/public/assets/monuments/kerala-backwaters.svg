<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="skyKerala" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="35%" stop-color="#047857"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="keralaLagoon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="sunKerala" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="200" height="200" rx="24" fill="url(#skyKerala)"/>

  <!-- Tropical Golden Sun -->
  <circle cx="150" cy="50" r="24" fill="url(#sunKerala)"/>
  <circle cx="150" cy="50" r="32" fill="#fef08a" opacity="0.25"/>

  <!-- Backwater Lagoon Water -->
  <rect x="0" y="125" width="200" height="75" fill="url(#keralaLagoon)"/>

  <!-- Flanking Coconut Palm Trees (Left) -->
  <g transform="translate(0,0)">
    <!-- Trunk 1 -->
    <path d="M 12 140 Q 25 90 18 35" stroke="#78350f" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Fronds -->
    <path d="M 18 35 Q -5 20 -20 30" stroke="#047857" stroke-width="3" fill="none"/>
    <path d="M 18 35 Q 5 10 -5 5" stroke="#10b981" stroke-width="3" fill="none"/>
    <path d="M 18 35 Q 35 15 45 25" stroke="#059669" stroke-width="3" fill="none"/>
    <path d="M 18 35 Q 38 35 48 45" stroke="#047857" stroke-width="3" fill="none"/>
    <!-- Coconuts -->
    <circle cx="15" cy="38" r="3" fill="#78350f"/>
    <circle cx="21" cy="38" r="3" fill="#78350f"/>
  </g>

  <!-- Flanking Coconut Palm Trees (Right) -->
  <g transform="translate(160,10)">
    <!-- Trunk 2 -->
    <path d="M 25 130 Q 10 85 15 35" stroke="#78350f" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <!-- Fronds -->
    <path d="M 15 35 Q -10 20 -20 35" stroke="#10b981" stroke-width="3" fill="none"/>
    <path d="M 15 35 Q 15 10 25 5" stroke="#059669" stroke-width="3" fill="none"/>
    <path d="M 15 35 Q 35 20 40 30" stroke="#047857" stroke-width="3" fill="none"/>
  </g>

  <!-- Kettuvalam Houseboat (Traditional Kerala Boat) -->
  <g transform="translate(35, 110)">
    <!-- Wooden Hull Base -->
    <path d="M 5 30 Q 60 48 125 30 L 115 42 Q 60 52 15 42 Z" fill="#451a03"/>
    <path d="M 10 32 Q 60 46 120 32" stroke="#78350f" stroke-width="2" fill="none"/>

    <!-- Woven Thatch Roof Cabin Structure -->
    <path d="M 25 30 Q 25 10 65 10 Q 105 10 105 30 Z" fill="#b45309"/>
    <!-- Thatch Texture Stripes -->
    <path d="M 35 30 Q 35 15 65 15 Q 95 15 95 30" stroke="#d97706" stroke-width="1.5" fill="none"/>
    <path d="M 45 30 Q 45 18 65 18 Q 85 18 85 30" stroke="#f59e0b" stroke-width="1.5" fill="none"/>

    <!-- Cabin Arched Windows -->
    <rect x="42" y="20" width="10" height="8" rx="2" fill="#fef08a"/>
    <rect x="60" y="20" width="10" height="8" rx="2" fill="#fef08a"/>
    <rect x="78" y="20" width="10" height="8" rx="2" fill="#fef08a"/>

    <!-- Curved Bow/Stern Prow Tip -->
    <path d="M 5 30 Q -5 18 -10 22 Q -5 32 10 35 Z" fill="#78350f"/>
    <path d="M 125 30 Q 135 18 140 22 Q 135 32 120 35 Z" fill="#78350f"/>
  </g>

  <!-- Water Reflection of Houseboat & Sun -->
  <ellipse cx="100" cy="155" rx="45" ry="8" fill="#f59e0b" opacity="0.2"/>
  <path d="M 50 152 L 150 152" stroke="#34d399" stroke-width="1" opacity="0.4" stroke-linecap="round"/>
  <path d="M 65 160 L 135 160" stroke="#a7f3d0" stroke-width="1" opacity="0.3" stroke-linecap="round"/>

  <!-- Border Frame -->
  <rect x="2" y="2" width="196" height="196" rx="22" fill="none" stroke="#10b981" stroke-width="2" opacity="0.8"/>
</svg>
