<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="skyDelhi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="sandstone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="tricolorGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9933"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background Sky -->
  <rect width="200" height="200" rx="24" fill="url(#skyDelhi)"/>

  <!-- Stars -->
  <circle cx="40" cy="30" r="1.2" fill="#ffffff" opacity="0.8"/>
  <circle cx="150" cy="35" r="1.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="90" cy="20" r="1" fill="#ffffff" opacity="0.6"/>

  <!-- Ground Lawn -->
  <rect x="0" y="165" width="200" height="35" fill="#064e3b"/>
  <rect x="0" y="160" width="200" height="5" fill="#047857"/>

  <!-- Tricolor Spotlight Beam Behind Gate -->
  <polygon points="40,165 100,20 160,165" fill="url(#tricolorGlow)" opacity="0.15"/>

  <!-- India Gate Base Steps -->
  <rect x="44" y="152" width="112" height="8" rx="1" fill="#7c2d12"/>
  <rect x="48" y="146" width="104" height="6" fill="#9a3412"/>

  <!-- Main Arch Columns Left & Right -->
  <!-- Left Pylon -->
  <rect x="54" y="70" width="28" height="76" fill="url(#sandstone)"/>
  <rect x="52" y="66" width="32" height="5" fill="#fdba74"/>
  <!-- Right Pylon -->
  <rect x="118" y="70" width="28" height="76" fill="url(#sandstone)"/>
  <rect x="116" y="66" width="32" height="5" fill="#fdba74"/>

  <!-- Central Grand Arch Cutout -->
  <path d="M 82 146 L 82 105 Q 82 86 100 86 Q 118 86 118 105 L 118 146 Z" fill="#0f172a"/>
  <path d="M 85 146 L 85 107 Q 85 90 100 90 Q 115 90 115 107 L 115 146 Z" fill="#020617"/>

  <!-- Top Entablature & Attic -->
  <!-- Main Cornice -->
  <rect x="48" y="58" width="104" height="8" fill="#fdba74"/>
  <rect x="52" y="44" width="96" height="14" fill="url(#sandstone)"/>
  <!-- Top Dome / Canopy Mold -->
  <rect x="56" y="38" width="88" height="6" fill="#fdba74"/>
  <rect x="64" y="32" width="72" height="6" fill="url(#sandstone)"/>
  
  <!-- "INDIA" Inscription Text Bar -->
  <rect x="70" y="47" width="60" height="8" rx="2" fill="#7c2d12"/>
  <text x="100" y="53.5" font-family="sans-serif" font-weight="900" font-size="6" fill="#fef08a" text-anchor="middle" letter-spacing="2">INDIA</text>

  <!-- Amar Jawan Jyoti (Eternal Flame) at Base Center -->
  <path d="M 94 146 L 106 146 L 103 138 L 97 138 Z" fill="#1e293b"/>
  <!-- Rifle & Helmet Silhouette -->
  <line x1="100" y1="138" x2="100" y2="126" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M 96 126 Q 100 123 104 126 Z" fill="#475569"/>
  <!-- Glowing Eternal Flame -->
  <circle cx="100" cy="136" r="4" fill="#ff9933" opacity="0.8"/>
  <circle cx="100" cy="136" r="2" fill="#fef08a"/>

  <!-- Tricolor Accent Ribbons on Pylons -->
  <rect x="54" y="74" width="28" height="3" fill="#ff9933"/>
  <rect x="54" y="77" width="28" height="3" fill="#ffffff"/>
  <rect x="54" y="80" width="28" height="3" fill="#10b981"/>

  <rect x="118" y="74" width="28" height="3" fill="#ff9933"/>
  <rect x="118" y="77" width="28" height="3" fill="#ffffff"/>
  <rect x="118" y="80" width="28" height="3" fill="#10b981"/>

  <!-- Border Frame -->
  <rect x="2" y="2" width="196" height="196" rx="22" fill="none" stroke="#ff9933" stroke-width="2" opacity="0.8"/>
</svg>
