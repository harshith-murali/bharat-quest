<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="skyAgra" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="45%" stop-color="#7c2d12"/>
      <stop offset="85%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="marble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="waterAgra" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <filter id="glowAgra" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="200" height="200" rx="24" fill="url(#skyAgra)"/>
  
  <!-- Crescent Moon & Stars -->
  <circle cx="160" cy="40" r="8" fill="#fef08a" opacity="0.9"/>
  <circle cx="163" cy="38" r="7" fill="url(#skyAgra)"/>
  <circle cx="35" cy="45" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="70" cy="30" r="1" fill="#ffffff" opacity="0.9"/>
  <circle cx="120" cy="25" r="1.5" fill="#ffffff" opacity="0.7"/>

  <!-- Background Sun/Glow Aura -->
  <circle cx="100" cy="115" r="45" fill="#ffedd5" opacity="0.25" filter="url(#glowAgra)"/>

  <!-- Taj Mahal Plinth Base -->
  <rect x="32" y="142" width="136" height="12" rx="2" fill="url(#marble)" stroke="#cbd5e1" stroke-width="0.5"/>
  <rect x="25" y="152" width="150" height="6" fill="#0f172a" opacity="0.3"/>

  <!-- Main Tomb Structure -->
  <path d="M 52 142 L 52 105 Q 52 100 57 100 L 143 100 Q 148 100 148 105 L 148 142 Z" fill="url(#marble)"/>
  <!-- Cut Corners Shadow -->
  <path d="M 52 142 L 62 142 L 62 100 L 52 105 Z" fill="#cbd5e1" opacity="0.4"/>
  <path d="M 148 142 L 138 142 L 138 100 L 148 105 Z" fill="#94a3b8" opacity="0.4"/>

  <!-- Main Center Archway (Iwan) -->
  <path d="M 80 142 L 80 115 Q 80 106 100 106 Q 120 106 120 115 L 120 142 Z" fill="#1e293b"/>
  <path d="M 83 142 L 83 117 Q 83 110 100 110 Q 117 110 117 117 L 117 142 Z" fill="#0f172a"/>
  
  <!-- Side Arches -->
  <path d="M 60 124 L 60 114 Q 60 110 67 110 Q 74 110 74 114 L 74 124 Z" fill="#334155"/>
  <path d="M 60 140 L 60 130 Q 60 126 67 126 Q 74 126 74 130 L 74 140 Z" fill="#334155"/>
  <path d="M 126 124 L 126 114 Q 126 110 133 110 Q 140 110 140 114 L 140 124 Z" fill="#334155"/>
  <path d="M 126 140 L 126 130 Q 126 126 133 126 Q 140 126 140 130 L 140 140 Z" fill="#334155"/>

  <!-- Main Onion Dome -->
  <path d="M 82 100 Q 82 72 100 66 Q 118 72 118 100 Z" fill="url(#marble)"/>
  <!-- Dome Finial/Spire -->
  <path d="M 100 66 L 100 52" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="100" cy="54" r="2.5" fill="#f59e0b"/>

  <!-- Flanking Small Domes (Gumbad) -->
  <path d="M 62 100 Q 62 88 70 85 Q 78 88 78 100 Z" fill="url(#marble)"/>
  <line x1="70" y1="85" x2="70" y2="78" stroke="#f59e0b" stroke-width="1.5"/>
  <path d="M 122 100 Q 122 88 130 85 Q 138 88 138 100 Z" fill="url(#marble)"/>
  <line x1="130" y1="85" x2="130" y2="78" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- 4 Corner Minarets -->
  <!-- Left Outer Minaret -->
  <rect x="36" y="80" width="6" height="62" fill="url(#marble)"/>
  <rect x="34" y="78" width="10" height="3" fill="#e2e8f0"/>
  <path d="M 36 78 L 39 70 L 42 78 Z" fill="url(#marble)"/>
  <line x1="39" y1="70" x2="39" y2="65" stroke="#f59e0b" stroke-width="1"/>

  <!-- Right Outer Minaret -->
  <rect x="158" y="80" width="6" height="62" fill="url(#marble)"/>
  <rect x="156" y="78" width="10" height="3" fill="#e2e8f0"/>
  <path d="M 158 78 L 161 70 L 164 78 Z" fill="url(#marble)"/>
  <line x1="161" y1="70" x2="161" y2="65" stroke="#f59e0b" stroke-width="1"/>

  <!-- Reflection Pool at Foreground -->
  <rect x="0" y="158" width="200" height="42" fill="url(#waterAgra)"/>
  <!-- Pool Reflection Shimmer -->
  <ellipse cx="100" cy="175" rx="35" ry="12" fill="#ffffff" opacity="0.15"/>
  <path d="M 85 168 L 115 168" stroke="#fef08a" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  <path d="M 90 178 L 110 178" stroke="#ffffff" stroke-width="1" opacity="0.3" stroke-linecap="round"/>

  <!-- Border Highlight Frame -->
  <rect x="2" y="2" width="196" height="196" rx="22" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.8"/>
</svg>
