server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # gzip — the JS bundle is ~1.2MB raw, ~350KB gzipped.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/wasm;

  # Security headers. The API sets its own; these cover the HTML app.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Hashed assets are immutable and safe to cache for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Question banks and the map image change between releases, so revalidate.
  location ~* \.(json|png|jpg|jpeg|svg|glb)$ {
    expires 1h;
    add_header Cache-Control "public, must-revalidate";
    try_files $uri =404;
  }

  # API reverse proxy. BACKEND_HOST is templated at container start
  # (see docker-compose / task definition).
  location /api/ {
    proxy_pass http://backend:3001/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Chat calls an external model; allow a generous read timeout.
    proxy_read_timeout 60s;
  }

  # Never cache the entry point, or clients pin to a stale bundle after deploy.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  # SPA fallback — client-side routes must resolve to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
