# Local production-parity stack.
#
#   cp .env.docker.example .env && docker compose up --build
#
# On AWS the same images run on ECS/Fargate or App Runner with Postgres
# replaced by RDS — set DATABASE_URL to the RDS endpoint and drop the `db`
# service here.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-bharat_quest}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published by default — only the backend needs it. Uncomment to
    # inspect the database from the host.
    # ports:
    #   - '5432:5432'

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bharat_quest}
      # Local Postgres has no TLS; RDS does (leave unset in AWS).
      PGSSL: disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      HF_API_KEY: ${HF_API_KEY:-}
      HF_MODEL: ${HF_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - '3001'

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${WEB_PORT:-8080}:80'

volumes:
  pgdata:
